# Run this project directly with `python run.py`; no package installation is needed.
# Declare Python and dependencies so `uv sync` can create .venv.
# There is no build step or installable package.

[project]
name = "vwaps-curve-filler"
version = "0.1.0"
description = "Fill complete power curves using own VWAPs and EEX settlements"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab>=4",
    "ipywidgets>=8",
    "plotly>=5",
]
experiment = [
    "mlflow>=3.5,<4",
    "psutil>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# Style preferences only: explicit try/except and if/else blocks are kept for readability.
ignore = ["SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Exploratory benchmark scripts: compact style is intended; logic rules still apply.
"research/*" = ["E501", "E702", "E731", "E402"]
# Imports intentionally follow sys.path setup or pytest.importorskip.
"examples/generate_notebook_demo.py" = ["E402"]
"tests/test_curve_viewer.py" = ["E402"]
"tests/test_experiment_browser.py" = ["E402"]
